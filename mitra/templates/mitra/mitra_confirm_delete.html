{% extends 'base.html' %}

{% block content %}
<style>
    /* Overlay Latar Belakang Transparan & Buram (Blur Effect Ala Instagram) */
    .modal-overlay-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
        box-sizing: border-box;
    }

    /* Modal Popup di Tengah Presisi */
    .instagram-style-modal {
        background: #FFFFFF;
        width: 100%;
        max-width: 420px;
        border-radius: 24px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.8);
        animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
        0% {
            opacity: 0;
            transform: scale(0.92);
        }
        100% {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Ikon Peringatan Merah Soft */
    .delete-icon-wrapper {
        width: 64px;
        height: 64px;
        background-color: #FCE8E6;
        color: #DC2626;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px auto;
    }

    .modal-title {
        font-size: 20px;
        font-weight: 800;
        color: #0F172A;
        margin: 0 0 10px 0;
        letter-spacing: -0.4px;
    }

    .modal-description {
        font-size: 14px;
        color: #64748B;
        margin: 0 0 28px 0;
        line-height: 1.5;
    }

    .store-name-highlight {
        color: #0F172A;
        font-weight: 700;
    }

    /* Tombol Aksi Sejajar */
    .modal-btn-group {
        display: flex;
        gap: 12px;
    }

    .btn-delete-confirm {
        background-color: #DC2626;
        color: #FFFFFF;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        flex: 1;
        transition: background-color 0.2s ease;
    }

    .btn-delete-confirm:hover {
        background-color: #B91C1C;
    }

    .btn-delete-cancel {
        background-color: #F1F5F9;
        color: #475569;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        text-align: center;
        border: none;
        flex: 1;
        transition: background-color 0.2s ease;
    }

    .btn-delete-cancel:hover {
        background-color: #E2E8F0;
        color: #0F172A;
    }
</style>

<div class="modal-overlay-backdrop">
    <div class="instagram-style-modal">
        <!-- Ikon Sampah/Peringatan Merah -->
        <div class="delete-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
                <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
            </svg>
        </div>

        <h3 class="modal-title">Hapus Toko Mitra?</h3>
        <p class="modal-description">
            Apakah kamu yakin ingin menghapus profil toko <span class="store-name-highlight">"{{ mitra.nama_toko }}"</span>? Tindakan ini tidak dapat dibatalkan.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="modal-btn-group">
                <a href="{% url 'mitra:mitra_profile' %}" class="btn-delete-cancel">Batal</a>
                <button type="submit" class="btn-delete-confirm">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
